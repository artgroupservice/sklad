<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>АРТ Групп · Склад</title>
<!--
  Обёртка приложения «Склад» на своём хосте (GitHub Pages).
  Зачем: приложение отдаёт Apps Script по ссылке …/exec с плашкой Google «создано пользователем
  Apps Script». Здесь приложение открывается во <iframe> на вашем домене, поэтому в адресной строке
  и на «домашнем экране» — ваш адрес, а не script.google.com. Для встраивания сервер отдаёт
  приложение с setXFrameOptionsMode(ALLOWALL) (см. src/server.gs → doGet в основном репозитории).

  QR и ссылки: этикетки печатают ?art=/?u=/?page=/?arts=. Обёртка прокидывает ВЕСЬ свой query-string
  в iframe без изменений — doGet сам разбирает нужные параметры и игнорирует лишние, так что старые
  и будущие параметры продолжают работать (QR не ломаются). Пример:
    https://elgar-mamedov.github.io/art-group-sklad-scan/?art=А-1050
  откроет карточку артикула А-1050.

  Сканер (scan.html) живёт рядом и работает как прежде: приложение открывает его новой вкладкой
  (window.open) и ждёт результат через postMessage — лишний слой iframe этому не мешает.

  PWA-мету (иконка, theme-color, standalone) повторяем из web/index.html, чтобы «Добавить на
  главный экран» создавал ярлык на этот адрес и запускал приложение как обычно.
-->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<!-- default (а не black-translucent): iOS сам ставит контент ПОД статус-баром, не поверх.
     Так верх не зависит от env(safe-area-inset-top), который в standalone-PWA ненадёжен. -->
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Склад">
<meta name="theme-color" content="#F5F5F3">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%20180%20180%22%3E%3Crect%20width%3D%22180%22%20height%3D%22180%22%20fill%3D%22%23B8901C%22%2F%3E%3Ctext%20x%3D%2290%22%20y%3D%2298%22%20font-family%3D%22-apple-system%2CSegoe%20UI%2CRoboto%2CArial%2Csans-serif%22%20font-size%3D%2252%22%20font-weight%3D%22800%22%20fill%3D%22%23fff%22%20text-anchor%3D%22middle%22%3E%D0%90%D0%A0%D0%A2%3C%2Ftext%3E%3C%2Fsvg%3E">
<style>
  :root {
    --bg: #F5F5F3; --gold: #B8901C; --muted: #6B6B6B;
    /* Высота плашки Google, которую перекрываем снизу. 0 = ничего не перекрываем.
       После деплоя ALLOWALL посмотреть на телефоне, появилась ли внизу полоса Google,
       и если да — выставить её высоту (напр. 30px). Своя нижняя панель приложения
       (#tab) при этом не страдает: полоса Google идёт ниже неё. */
    --gas-bar-h: 0px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  body {
    font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  /* Контейнер приложения на весь экран. Безопасные зоны НЕ задаём здесь:
     - верх: статус-бар резервирует сам iOS (status-bar-style=default — контент под ним);
     - низ: домашний индикатор учитывает само приложение (панель #tab и её
       --safe=env(safe-area-inset-bottom) работают внутри iframe).
     Раньше верх пытались отвести через env(safe-area-inset-top) в обёртке, но в
     standalone-PWA это ненадёжно (где-то работает, где-то шапка пряталась под статус-бар). */
  #appframe { position: fixed; inset: 0; background: var(--bg); }
  #app { width: 100%; height: 100%; border: 0; display: block; background: var(--bg); }
  /* Перекрытие плашки Google снизу (высота — в --gas-bar-h). По умолчанию 0 — не видно.
     Садится на нижнюю кромку iframe (над домашним индикатором), в одной зоне с панелью #tab. */
  #gasCover {
    position: fixed; left: 0; right: 0; bottom: 0; height: var(--gas-bar-h);
    background: var(--bg); z-index: 2; pointer-events: none;
  }
  /* Экран загрузки — пока грузится iframe. */
  #boot {
    position: fixed; inset: 0; z-index: 3; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px; background: var(--bg);
    transition: opacity .25s ease; color: var(--muted); font-size: 14px;
  }
  #boot.hide { opacity: 0; pointer-events: none; }
  .mark {
    width: 64px; height: 64px; border-radius: 16px; background: var(--gold); color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 800;
  }
  .spin {
    width: 22px; height: 22px; border: 2.5px solid rgba(0,0,0,.12); border-top-color: var(--gold);
    border-radius: 50%; animation: rot .8s linear infinite;
  }
  @keyframes rot { to { transform: rotate(360deg); } }
</style>
</head>
<body>
  <div id="appframe">
    <iframe id="app" title="АРТ Групп · Склад"
            allow="camera; microphone; fullscreen; clipboard-read; clipboard-write"></iframe>
  </div>
  <div id="gasCover"></div>
  <div id="boot">
    <div class="mark">АРТ</div>
    <div class="spin"></div>
    <div>Загружаю склад…</div>
  </div>

<script>
(function () {
  // Развёртывание приложения в Apps Script. Меняется только при новом развёртывании (deploy.json).
  var EXEC = 'https://script.google.com/macros/s/AKfycbybpbr1qooSMT1iHqtZNUbp2h9q1UhhylkDtk9xuS9qrv1Moc_ykImSu9zLNBuF0S6w/exec';

  var app = document.getElementById('app');
  var boot = document.getElementById('boot');

  // Прокидываем весь query-string как есть (?art=/?u=/?page=/?arts=). doGet разберёт нужное,
  // лишнее проигнорирует — поэтому и старые, и будущие параметры этикеток продолжают работать.
  app.src = EXEC + (location.search || '');

  // Прячем загрузку, когда приложение отрисовалось. load у cross-origin iframe срабатывает,
  // но дадим и страховку по таймеру — на случай, если браузер его не отдаст.
  var hidden = false;
  function hideBoot() {
    if (hidden) return;
    hidden = true;
    boot.classList.add('hide');
    setTimeout(function () { boot.remove(); }, 300);
  }
  app.addEventListener('load', hideBoot);
  setTimeout(hideBoot, 6000);

  // --- Сканер QR как оверлей внутри обёртки --------------------------------------------
  // Приложение (в iframe Apps Script) камеру не получает: Google кладёт наш HTML в свой
  // вложенный sandbox-iframe без allow="camera". Поэтому по просьбе приложения показываем
  // сканер scan.html (наш же хост) оверлеем-iframe с allow="camera" — здесь камера доступна.
  // Удаление iframe мгновенно гасит камеру — это и есть надёжная «отмена» на iOS PWA, где
  // отдельную вкладку Safari поверх приложения закрыть/погасить нельзя. Результат QR
  // возвращаем приложению тем же postMessage {type:'qr-scan'}, что и прежняя вкладка сканера.
  var appWin = null;      // окно приложения (источник просьбы) — куда вернуть результат
  var scanFrame = null;   // активный оверлей-сканер
  var scanBack = null;    // затемнение фона за окном сканера (на компьютере)

  function openScanner() {
    if (scanFrame) return;
    // На компьютере сканер не нужен на весь экран — показываем компактным окном по центру
    // с затемнением фона. На телефоне — на весь экран (так удобнее наводить).
    var desk = window.matchMedia('(min-width: 1000px)').matches;
    var f = document.createElement('iframe');
    f.src = 'scan.html';
    f.title = 'Сканер QR';
    f.setAttribute('allow', 'camera');
    if (desk) {
      scanBack = document.createElement('div');
      scanBack.style.cssText = 'position:fixed;inset:0;z-index:10;background:rgba(0,0,0,.45);';
      document.body.appendChild(scanBack);
      f.style.cssText = 'position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);'
        + 'width:420px;height:560px;max-width:92vw;max-height:88vh;border:0;border-radius:16px;'
        + 'z-index:11;background:#000;box-shadow:0 20px 60px rgba(0,0,0,.4);overflow:hidden;';
    } else {
      f.style.cssText = 'position:fixed;inset:0;width:100%;height:100%;border:0;z-index:11;background:#000;';
    }
    document.body.appendChild(f);
    scanFrame = f;
  }
  function closeScanner() {
    if (scanFrame) { scanFrame.remove(); scanFrame = null; }   // удаление iframe гасит камеру
    if (scanBack) { scanBack.remove(); scanBack = null; }
  }

  window.addEventListener('message', function (e) {
    var d = e.data;
    if (!d || typeof d !== 'object') return;
    // Просьбы приложения (из iframe Apps Script):
    if (d.type === 'open-scanner') {
      appWin = e.source;
      openScanner();
      try { appWin.postMessage({ type: 'scanner-opened' }, '*'); } catch (x) {}
      return;
    }
    if (d.type === 'close-scanner') { closeScanner(); return; }
    // Сообщения от самого оверлея-сканера (наш origin, наш iframe):
    if (scanFrame && e.source === scanFrame.contentWindow) {
      if (d.type === 'qr-scan' && typeof d.text === 'string') {
        closeScanner();
        if (appWin) { try { appWin.postMessage({ type: 'qr-scan', text: d.text }, '*'); } catch (x) {} }
      } else if (d.type === 'qr-close') {
        closeScanner();
      }
    }
  });
})();
</script>
</body>
</html>
